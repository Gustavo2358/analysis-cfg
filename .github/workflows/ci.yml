name: COACTUPC physical smoke (pinned snapshot)
"on":
  push:
    branches: [test/coactupc-physical-smoke-20260921]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MAVEN_OPTS: -Xmx2g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout analysis-cfg at exact snapshot
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/analysis-cfg
          ref: 7a4a2104d3c284e8efc1700413839f33551b474f
          path: snapshot/analysis-cfg
          persist-credentials: false
      - name: Checkout proleap-poc at exact snapshot
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/proleap-poc
          ref: 93a42de83da823e69514cdefe2a9aa0ef0182ce2
          path: snapshot/proleap-poc
          persist-credentials: false
      - name: Checkout cobol-lower at exact snapshot
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/cobol-lower
          ref: 2beb5f8329885c7f5921d9a5d50f172901624b55
          path: snapshot/cobol-lower
          persist-credentials: false
      - name: Checkout air-java at exact snapshot
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/air-java
          ref: 980d4989a18f876996390cc61af41419a595eb7b
          path: snapshot/air-java
          persist-credentials: false
          token: ${{ secrets.AIR_JAVA_READ_TOKEN || github.token }}
      - name: Checkout analysis-ir at exact snapshot
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/analysis-ir
          ref: b628e4c1a62de61a157cac85ae71ba4cd111052e
          path: snapshot/analysis-ir
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare harness dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Build and run single bounded physical smoke
        run: |
          cat > run_smoke.py <<'PY_SMOKE'
          #!/usr/bin/env python3
          """One bounded, exact-revision COACTUPC physical smoke test. No source changes."""
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import signal
          import subprocess
          import sys
          import time
          
          ROOT = Path(os.environ.get('GITHUB_WORKSPACE', '.')).resolve()
          OUT = ROOT / 'smoke-evidence'
          OUT.mkdir(exist_ok=False)
          PINS = {
              'analysis-cfg': '7a4a2104d3c284e8efc1700413839f33551b474f',
              'proleap-poc': '93a42de83da823e69514cdefe2a9aa0ef0182ce2',
              'cobol-lower': '2beb5f8329885c7f5921d9a5d50f172901624b55',
              'air-java': '980d4989a18f876996390cc61af41419a595eb7b',
              'analysis-ir': 'b628e4c1a62de61a157cac85ae71ba4cd111052e',
          }
          REPOS = {name: ROOT / 'snapshot' / name for name in PINS}
          M2 = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'coactupc-smoke-m2'
          REPORT = {'requested_test': 'COACTUPC default source and default copybook paths; explicit physical mode',
                    'pins': PINS, 'stages': [], 'status': 'IN_PROGRESS',
                    'environment': {'platform': platform.platform(), 'python': sys.version,
                                    'cpu_count': os.cpu_count(), 'java_heap': '3 GiB',
                                    'analysis_timeout_seconds': 300},
                    'scope': 'Single-program smoke, not a full regression suite or production qualification.'}
          
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          def save():
              (OUT / 'summary.json').write_text(json.dumps(REPORT, indent=2) + '\n')
          
          def run(name, argv, cwd, seconds=600, required=True):
              argv = list(map(str, argv))
              row = {'stage': name, 'argv': argv, 'cwd': str(cwd), 'timeout_seconds': seconds}
              REPORT['stages'].append(row)
              save()
              print('START', name, flush=True)
              start = time.monotonic()
              timed = ['/usr/bin/time', '-v', '-o', str(OUT / (name + '.time.txt'))] + argv
              with (OUT / (name + '.stdout.log')).open('wb') as stdout, (OUT / (name + '.stderr.log')).open('wb') as stderr:
                  process = subprocess.Popen(timed, cwd=cwd, stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code = process.wait(timeout=seconds)
                      row['timed_out'] = False
                  except subprocess.TimeoutExpired:
                      row['timed_out'] = True
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                      code = 124
              row.update(exit_code=code, seconds=round(time.monotonic() - start, 3))
              timing = OUT / (name + '.time.txt')
              if timing.exists():
                  for line in timing.read_text().splitlines():
                      if 'Maximum resident set size (kbytes):' in line:
                          row['maximum_rss_kib'] = int(line.rsplit(':', 1)[1])
              save()
              print('END', json.dumps(row), flush=True)
              if code != 0:
                  for suffix in ('stdout.log', 'stderr.log'):
                      print((OUT / (name + '.' + suffix)).read_text(errors='replace')[-12000:], flush=True)
                  if required:
                      raise RuntimeError(f'{name} failed: exit_code={code}, timed_out={row["timed_out"]}')
              return row
          
          def mvn(repo, name, goals, extra=()):
              return run(name, ['mvn', '-B', '-ntp', f'-Dmaven.repo.local={M2}', *extra, *goals], REPOS[repo])
          
          def classpath(repo, module, name):
              file = OUT / (name + '-classpath.txt')
              extra = ['-f', str(REPOS[repo] / module / 'pom.xml')] if module else []
              mvn(repo, name + '-classpath', ['org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath'],
                  [*extra, '-DincludeScope=runtime', f'-Dmdep.outputFile={file}'])
              return str(REPOS[repo] / module / 'target/classes') + ':' + file.read_text().strip()
          
          def java(cp, main, *args):
              return ['java', '-Xmx3g', '-Xss4m', '-XX:+ExitOnOutOfMemoryError', '-cp', cp, main, *args]
          
          try:
              observed = {}
              for name, expected in PINS.items():
                  actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=REPOS[name], text=True).strip()
                  assert actual == expected, (name, actual, expected)
                  observed[name] = actual
              REPORT['observed_pins'] = observed
              run('java-version', ['java', '-version'], ROOT, 30)
              run('maven-version', ['mvn', '-version'], ROOT, 30)
              source = REPOS['proleap-poc'] / 'corpus/cbl/COACTUPC.cbl'
              REPORT['source'] = {'path': 'corpus/cbl/COACTUPC.cbl', 'sha256': digest(source),
                                  'bytes': source.stat().st_size, 'lines': len(source.read_bytes().splitlines())}
              REPORT['copybook_paths'] = ['corpus/cpy', 'corpus/cpy-bms']
              copybooks = {str(p.relative_to(REPOS['proleap-poc'])): digest(p)
                          for directory in REPORT['copybook_paths']
                          for p in sorted((REPOS['proleap-poc'] / directory).rglob('*')) if p.is_file()}
              (OUT / 'input-copybooks-sha256.json').write_text(json.dumps(copybooks, indent=2) + '\n')
              save()
          
              # The upstream build enforces non-skipped tests. Respect its standard install.
              mvn('air-java', 'build-air-java', ['clean', 'install'])
              mvn('proleap-poc', 'build-frontend', ['package'], ['-DskipTests'])
              mvn('cobol-lower', 'build-lower', ['install'])
              mvn('analysis-cfg', 'build-analysis', ['install'], ['-DskipTests'])
              front_cp = classpath('proleap-poc', '', 'frontend')
              lower_cp = classpath('cobol-lower', 'adapters', 'lower')
              cfg_cp = classpath('analysis-cfg', 'cfg-launcher', 'cfg')
              dependency_cp = classpath('analysis-cfg', 'analysis-launcher', 'dependency')
              front_out = OUT / 'frontend'
              run('frontend', java(front_cp, 'io.github.gustavo2358.cobolexplorer.ExplorerMain',
                  '--output', front_out, '--storage-profile', 'ibm-enterprise-6.4-fixed-display-1047@1',
                  '--logical-text', 'disabled', '--entry-storage-state', 'unknown', '--cics-entry-mode', 'unknown'),
                  REPOS['proleap-poc'], 300)
              # Deliberately omit --source and --copybooks: exercise the actual CLI defaults.
              sp_path = front_out / 'cobol-semantic-product.json'
              sp = json.loads(sp_path.read_text())
              REPORT['semantic_product'] = {'bytes': sp_path.stat().st_size, 'sha256': digest(sp_path),
                                            'storage_profile': sp['storage']['profile']}
              assert sp['storage']['profile'] == 'IBM_ENTERPRISE_6_4_FIXED_DISPLAY_1047'
              air_path = OUT / 'air.json'
              run('lower', java(lower_cp, 'io.github.gustavo2358.lower.adapters.cli.CobolLower', sp_path, air_path), ROOT, 300)
              air_hash = digest(air_path)
              air = json.loads(air_path.read_text())
              REPORT['air'] = {'bytes': air_path.stat().st_size, 'sha256': air_hash,
                               'storage_kinds': dict(collections.Counter(s['kind'] for s in air['publication']['storage']))}
              save()
              # Standalone CFG serialization is diagnostic; dependencies also builds its own CFG.
              run('cfg', java(cfg_cp, 'io.github.gustavo2358.analysis.cfg.launcher.AnalysisCfg', air_path, OUT / 'cfg.json'),
                  ROOT, 300, required=False)
              dependencies = OUT / 'dependencies.json'
              assert not dependencies.exists(), 'Output must be fresh, not inherited from another run.'
              run('dependencies-physical', java(dependency_cp, 'io.github.gustavo2358.analysis.launcher.AnalysisDependencies',
                  air_path, dependencies, '--experimental-physical'), ROOT, 300)
              assert dependencies.exists() and dependencies.stat().st_size > 0
              data = json.loads(dependencies.read_text())
              metrics = data['metrics']
              assert metrics['experimentalPhysicalMode'] == 1 and metrics['logicalOnlyMode'] == 0, metrics
              assert digest(air_path) == air_hash, 'Consumer changed its AIR input.'
              assert digest(source) == REPORT['source']['sha256'], 'Source changed.'
              REPORT['dependencies'] = {'bytes': dependencies.stat().st_size, 'sha256': digest(dependencies),
                  'top_level_keys': list(data), 'sites': len(data['sites']), 'edges': len(data['edges']), 'metrics': metrics,
                  'candidates_by_site': [{'operation': s.get('operation'), 'command': s.get('command'),
                      'targetStatus': s.get('targetStatus'), 'targetKind': s.get('targetKind'),
                      'candidates': [c.get('referenceName') for c in s.get('candidates', [])],
                      'effectiveUnknownRemainder': s.get('effectiveUnknownRemainder')} for s in data['sites']]}
              REPORT['physical_work_observed'] = metrics.get('physicalGroupsApplied', 0) > 0 and metrics.get('physicalWritesApplied', 0) > 0
              REPORT['status'] = 'DEPENDENCIES_GENERATED_PHYSICAL_MODE'
          except Exception as error:
              REPORT['status'] = 'FAILED'
              REPORT['failure'] = str(error)
          finally:
              REPORT['tracked_changes'] = {name: subprocess.run(['git', 'diff', '--name-only', 'HEAD'], cwd=repo,
                  capture_output=True, text=True).stdout.splitlines() for name, repo in REPOS.items() if repo.exists()}
              REPORT['artifacts'] = {str(p.relative_to(OUT)): {'bytes': p.stat().st_size, 'sha256': digest(p)}
                                     for p in sorted(OUT.rglob('*')) if p.is_file() and p.name != 'summary.json'}
              save()
              print('SMOKE_SUMMARY_BEGIN', flush=True)
              # Log a compact receipt; the artifact retains all files and the complete summary.
              print(json.dumps({k: v for k, v in REPORT.items() if k != 'artifacts'}, indent=2), flush=True)
              print('SMOKE_SUMMARY_END', flush=True)
              sys.exit(0 if REPORT['status'] == 'DEPENDENCIES_GENERATED_PHYSICAL_MODE' else 1)
          PY_SMOKE
          python3 -u run_smoke.py
      - name: Retain commands, logs, timings and generated products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coactupc-physical-smoke-${{ github.run_id }}
          path: |
            smoke-evidence/
            run_smoke.py
          if-no-files-found: warn
          retention-days: 7

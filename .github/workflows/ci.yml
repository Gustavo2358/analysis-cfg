name: COACTUPC owner minimal endpoint matrix
"on":
  push:
    branches: [test/coactupc-physical-smoke-20260921]
permissions:
  contents: read
jobs:
  minimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Gustavo2358/proleap-poc
          ref: 93a42de83da823e69514cdefe2a9aa0ef0182ce2
          path: frontend
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build unchanged frontend
        working-directory: frontend
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -DincludeScope=runtime -Dmdep.outputFile=classpath.txt
      - name: Execute endpoint matrix
        run: |
          cat > minimize.py <<'PY'
          import json,pathlib,subprocess,os,hashlib,itertools
          R=pathlib.Path(os.environ['GITHUB_WORKSPACE']);F=R/'frontend';E=R/'minimal-evidence';E.mkdir()
          cp=str(F/'target/classes')+':'+(F/'classpath.txt').read_text().strip()
          src=F/'src/main/java/io/github/gustavo2358/cobolexplorer/SourceDependencySemantics.java'
          text=src.read_text();marker='for(var fact:facts) {'
          assert text.count(marker)==1
          text=text.replace(marker,'for(var unit:units) System.err.println("DIAG_UNIT "+unit.id()+" "+unit.program().meta().provenance());\n        for(var f:facts) System.err.println("DIAG_FACT "+f.name()+" root="+f.rootSite());\n        '+marker)
          (E/'SourceDependencySemantics.java').write_text(text);classes=E/'classes';classes.mkdir()
          subprocess.run(['javac','--release','21','-cp',cp,'-d',str(classes),str(E/'SourceDependencySemantics.java')],check=True)
          traced=str(classes)+':'+cp
          prefix='       IDENTIFICATION DIVISION.\n       PROGRAM-ID. TINY.\n       PROCEDURE DIVISION.\n'
          bodies={'display':"           DISPLAY 'OK'.\n",'paragraph':'       BODY-PARA.\n           EXIT\n           .\n'}
          directives={'inline':'           COPY BODY.\n','split':'           COPY BODY\n           .\n'}
          rows=[]
          def run_case(name,source,body,mode='logical'):
            d=E/name;d.mkdir();cpy=d/'copybooks';cpy.mkdir();(cpy/'BODY.cpy').write_text(body);p=d/'main.cbl';p.write_text(source)
            args=['java','-Xmx2g','-cp',traced,'io.github.gustavo2358.cobolexplorer.ExplorerMain','--source',str(p),'--copybooks',str(cpy),'--output',str(d/'out')]
            if mode=='physical':args+=['--storage-profile','ibm-enterprise-6.4-fixed-display-1047@1','--logical-text','disabled']
            with (d/'stdout.log').open('w') as out,(d/'stderr.log').open('w') as err:
              result=subprocess.run(args,cwd=F,stdout=out,stderr=err,timeout=60)
            err=(d/'stderr.log').read_text();tree=d/'out/tree-data.js';meta=None
            if tree.exists():
              t=tree.read_text();meta=json.loads(t[t.index('=')+1:].strip().rstrip(';'))['meta']
            row={'name':name,'mode':mode,'exit_code':result.returncode,'owner_exception':'SOURCE_DEPENDENCY_OWNER_UNPROVED' in err,'sp_exists':(d/'out/cobol-semantic-product.json').exists(),'meta':meta,'source':source,'body':body,'diagnostics':[l for l in err.splitlines() if l.startswith('DIAG_')],'argv':args}
            rows.append(row);print('RESULT',json.dumps(row),flush=True);(E/'results.json').write_text(json.dumps(rows,indent=2)+'\n')
          for bodykey,directivekey,copycomment,rootcomment in itertools.product(bodies,directives,[False,True],[False,True]):
            name=f'{bodykey}-{directivekey}-copycomment{int(copycomment)}-rootcomment{int(rootcomment)}'
            body=bodies[bodykey]+('      * trailing comment in copybook\n' if copycomment else '')
            source=prefix+directives[directivekey]+('      * trailing comment in root\n' if rootcomment else '')
            run_case(name,source,body)
          failures=[r for r in rows if r['owner_exception']]
          if failures:
            first=failures[0]
            run_case('witness-physical',first['source'],first['body'],'physical')
            run_case('witness-end-program-control',first['source']+'       END PROGRAM TINY.\n',first['body'])
            run_case('witness-code-after-copy-control',first['source']+'           GOBACK.\n',first['body'])
          else:print('NO_MINIMAL_OWNER_FAILURE_OBSERVED',flush=True)
          status={'pin':subprocess.check_output(['git','rev-parse','HEAD'],cwd=F,text=True).strip(),'cases':len(rows),'owner_failures':len([r for r in rows if r['owner_exception']]),'tracked_changes':subprocess.check_output(['git','diff','--name-only','HEAD'],cwd=F,text=True).splitlines()}
          (E/'receipt.json').write_text(json.dumps(status,indent=2)+'\n');print('MATRIX_RECEIPT',json.dumps(status),flush=True)
          PY
          python3 -u minimize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coactupc-owner-minimal-${{ github.run_id }}
          path: |
            minimal-evidence/
            minimize.py
          retention-days: 7

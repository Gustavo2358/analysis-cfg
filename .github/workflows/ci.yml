name: Core CFG checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis-cfg
        uses: actions/checkout@v4
        with:
          path: analysis-cfg
          fetch-depth: 0

      - name: Check out pinned air-java source
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/air-java
          ref: 2a37f5e980ba25fdc79614a66030a84d8bf5b8c9
          path: air-java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out read-only E2E frontend baseline
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/proleap-poc
          ref: 53d774026a1e4bcd969c7783a1d277aaa87b5f2f
          path: proleap-poc
          fetch-depth: 0

      - name: Check out read-only E2E lowering baseline
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/cobol-lower
          ref: 9de3825da64898258e647727393f01b9e9198d9e
          path: cobol-lower
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record actual CI source checkout
        working-directory: analysis-cfg
        run: python3 -B scripts/project/ci_source_receipt.py --output .harness-results/ci-source-receipt.json

      - name: Preserve CI source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-receipt
          path: analysis-cfg/.harness-results/ci-source-receipt.json
          if-no-files-found: error

      - name: Verify pinned air-java checkout
        working-directory: air-java
        run: test "$(git rev-parse HEAD)" = "2a37f5e980ba25fdc79614a66030a84d8bf5b8c9"

      - name: Install pinned air-java SNAPSHOT
        working-directory: air-java
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: mvn -B -ntp clean install

      - name: Record exact upstream tree and installed JAR provenance
        working-directory: analysis-cfg
        run: python3 -B scripts/project/record_air_dependency.py --checkout ../air-java --built-source ../air-java --maven-repo "${{ runner.temp }}/analysis-cfg-m2" --output .harness-results/air-dependency-receipt.json

      - name: Check documentation and harness
        working-directory: analysis-cfg
        run: bash scripts/harness/check-fast.sh

      - name: Build isolated historical CP5 producer snapshots
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/w5-m2
        run: |
          cp -a "${{ runner.temp }}/analysis-cfg-m2" "${{ runner.temp }}/w5-m2"
          python3 -B scripts/project/prepare_w5_producers.py --work "${{ runner.temp }}/w5-producers"

      - name: Check baseline scope and exact manifest
        working-directory: analysis-cfg
        run: python3 -B scripts/project/check_scope.py

      - name: Check Java architecture boundary
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: bash scripts/harness/check-architecture.sh

      - name: Check CFG-FIRST, linear, Branch and projection policy oracles
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: bash scripts/harness/check-semantic.sh

      - name: Check real AIR file to CFG JSON integration
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
          W5_PRODUCERS: ${{ runner.temp }}/w5-producers/producers.json
        run: bash scripts/harness/check-integration.sh

      - name: Check CP5 W1 structural semantics and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 1

      - name: Check CP5 W2 solver oracles and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 2

      - name: Check CP5 W3 values, point queries and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 3

      - name: Check CP5 W4 shared planning, consumers and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 4

      - name: Check CP5 W5 production, delivery, scale and quality
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 5

      - name: Check full W1–W5 regression on the new upstream
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
          W5_PRODUCERS: ${{ runner.temp }}/w5-producers/producers.json
        run: bash scripts/harness/check-full.sh

      - name: Build exact isolated W1A and W1C producers
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/prepare_w1d_producers.py --work "${{ runner.temp }}/w1d-producers"

      - name: Check W1D CFG effects consumer planning wire and CLI
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_w1d.py

      - name: Check real W1D vertical twice without injections
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/e2e_w1d.py --work .harness-results/w1d-e2e --producers "${{ runner.temp }}/w1d-producers/producers.json"

      - name: Challenge W1D semantics and restore exact source
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/challenge_w1d.py --work .harness-results/w1d-mutations

      - name: Preserve CP5 and W1D execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-execution-evidence
          path: analysis-cfg/.harness-results/
          include-hidden-files: true
          if-no-files-found: error

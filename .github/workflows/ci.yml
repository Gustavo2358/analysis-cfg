name: Fast PR CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis-cfg
        uses: actions/checkout@v4
        with:
          path: analysis-cfg
          fetch-depth: 0

      - name: Check out pinned air-java source
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/air-java
          ref: 2a37f5e980ba25fdc79614a66030a84d8bf5b8c9
          path: air-java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pinned air-java checkout
        working-directory: air-java
        run: test "$(git rev-parse HEAD)" = "2a37f5e980ba25fdc79614a66030a84d8bf5b8c9"

      - name: Record actual CI source checkout
        working-directory: analysis-cfg
        run: python3 -B scripts/project/ci_source_receipt.py --output .harness-results/ci-source-receipt.json

      - name: Preserve CI source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-receipt
          path: analysis-cfg/.harness-results/ci-source-receipt.json
          if-no-files-found: error

      - name: FAST_CI
        working-directory: analysis-cfg
        run: bash scripts/harness/check-pr-fast.sh --work .harness-results/fast-ci --maven-repo "${{ runner.temp }}/analysis-cfg-m2"

      - name: Preserve Fast CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-ci-evidence
          path: analysis-cfg/.harness-results/fast-ci/evidence/
          include-hidden-files: true
          if-no-files-found: error

name: Core CFG checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis-cfg
        uses: actions/checkout@v4
        with:
          path: analysis-cfg
          fetch-depth: 0

      - name: Check out pinned air-java source
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/air-java
          ref: ce530a7e17ab12b23c48f29425f503ff920b09fb
          path: air-java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record actual CI source checkout
        working-directory: analysis-cfg
        run: python3 -B scripts/project/ci_source_receipt.py --output .harness-results/ci-source-receipt.json

      - name: Preserve CI source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-receipt
          path: analysis-cfg/.harness-results/ci-source-receipt.json
          if-no-files-found: error

      - name: Verify pinned air-java checkout
        working-directory: air-java
        run: test "$(git rev-parse HEAD)" = "ce530a7e17ab12b23c48f29425f503ff920b09fb"

      - name: Install pinned air-java SNAPSHOT
        working-directory: air-java
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: mvn -B -ntp clean install

      - name: Check documentation and harness
        working-directory: analysis-cfg
        run: bash scripts/harness/check-fast.sh

      - name: Check CP5 W4 scope and exact manifest
        working-directory: analysis-cfg
        run: python3 -B scripts/project/check_scope.py

      - name: Check Java architecture boundary
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: bash scripts/harness/check-architecture.sh

      - name: Check CFG-FIRST, linear, Branch and projection policy oracles
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: bash scripts/harness/check-semantic.sh

      - name: Check real AIR file to CFG JSON integration
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: bash scripts/harness/check-integration.sh

      - name: Check CP5 W1 structural semantics and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 1

      - name: Check CP5 W2 solver oracles and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 2

      - name: Check CP5 W3 values, point queries and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 3

      - name: Check CP5 W4 shared planning, consumers and performance
        working-directory: analysis-cfg
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/analysis-cfg-m2
        run: python3 -B scripts/project/check_cp5_gate.py performance --wave 4

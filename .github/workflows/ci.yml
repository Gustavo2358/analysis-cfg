name: Fast CI
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned private AIR dependency
        uses: actions/checkout@v4
        with:
          repository: Gustavo2358/air-java
          ref: 26016f10460336f237a33b2ed126a6a1427f0207
          token: ${{ secrets.AIR_JAVA_READ_TOKEN }}
          path: .harness-results/build/air-java
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -B scripts/harness/lean.py ci

objective: Dialetos selecionados, Report Writer e catálogo de APIs
motivation: Cobertura ampla precisa de contratos finitos para extensões; nome de CALL não prova arquivo.
repos:
- proleap-poc
- cobol-lower
- analysis-cfg
- air-java/analysis-ir somente por gap
preconditions:
- W7 nomes/captura
- W8–W9 consumers/escopo pertinentes
- D-D-AUTH fechado para D-GC32 e D-v1
read_first:
- ../../product/file-dependencies/brief.md
- ../../product/file-dependencies/contracts.md
- ../../product/file-dependencies/verification.md
expected_product:
- 'D01–D04/D08: variantes selecionadas de ASSIGN/lock/PREVIOUS/COMMIT/ROLLBACK/streams e Report Writer'
- D-v1 dez APIs com assinatura/perfil/papéis/efeitos/outcomes/fonte/testes; FLUSH é negativo conforme GnuCOBOL
- Nome→handle no OPEN, aliases/cópia/rebinding/close/unknown handle; COPY/RENAME origem/destino
allowed_changes:
- Catálogo tipado versionado e tradução via contratos gerais; testes independentes
- Correções de gramática por autoridade; nenhuma dependência runtime de compilador
forbidden_changes:
- Heurística FILE/OPEN no nome de wrapper, assinatura universal CBL_*
- Substituir program dependency por file dependency; remover catálogo para atingir 100%
invariants:
- Todos os invariantes do brief e guardrail COBOL_SOURCE_ONLY
- Preservar CALL/evidência; literal não espera solver; mudanças normativas só bilaterais
semantic_cases:
- N18/D01–D08 conforme profile; T34/T42–T45; D07 negativo
- Report→arquivo; handle copiado/sobrescrito/desconhecido; CALL+FILE simultâneos
tests:
- Oráculos independentes dos casos listados em test-catalog.md; positivos, negativos e adversariais antes do
  código
- CALL-X6
- T45
- API CALL supports/remainders
regressions:
- CALL-X6
- T45
- API CALL supports/remainders
commands_and_gates:
- 'F-DECL: comando e escopo em ../../product/file-dependencies/verification.md'
- 'L-INPUT: comando e escopo em ../../product/file-dependencies/verification.md'
- 'C-VALUES: comando e escopo em ../../product/file-dependencies/verification.md'
- 'C-DEP: comando e escopo em ../../product/file-dependencies/verification.md'
- 'B-SP: comando e escopo em ../../product/file-dependencies/verification.md'
- 'B-AIR: comando e escopo em ../../product/file-dependencies/verification.md'
- 'B-WIRE: comando e escopo em ../../product/file-dependencies/verification.md'
- 'E-SELECTED: comando e escopo em ../../product/file-dependencies/verification.md'
- 'Q-SHARED: comando e escopo em ../../product/file-dependencies/verification.md'
- python3 -B scripts/harness/lean.py fast — uma vez por repo produtivo estabilizado, após focais
acceptance:
- Todas as entradas D-v1 possuem assinatura e oráculos; APIs por nome e handle distinguíveis
- Wrapper sem contrato não produz FILE; handle desconhecido em API comprovada preserva uso aberto
- Report Writer gera usos corretos, sem CALL fictício; stub de compatibilidade não gera I/O inventado
- Resultado conserva CALL da biblioteca e FILE derivado com evidência de contrato
evidence:
- Commit/pin exatos por fronteira; comandos/exit/results reais, testes novos vs REUSED vs NOT_RUN
- Atualizar matriz somente com oracle/resultado; estado curto e PR persistente por repo, sem receipt obrigatório
stop_condition: Parar com subset D selecionado qualificado; extensão/redução do escopo exige decisão explícita.

id: FD-W1
title: Slice vertical estático e saída pública
status: IN_PROGRESS
scope:
- file-dependencies
- air-java
- cobol-lower
- analysis-cfg
- proleap-poc (somente ajuste bilateral)
- analysis-ir (condicional)
objective: Slice vertical estático e saída pública
motivation: O codec recusa resources/relations não vazios e o reader de dependency é estrito; provar a fronteira
  cedo.
repos:
- air-java
- cobol-lower
- analysis-cfg
- proleap-poc (somente ajuste bilateral)
- analysis-ir (condicional)
preconditions:
- W0 qualificado
- Fechar D-AIR com A1–A4/A6 antes de editar contrato; fechar D-WIRE após auditoria dos readers; A5 não bloqueia core
read_first:
- ../../product/file-dependencies/brief.md
- ../../product/file-dependencies/contracts.md
- ../../product/file-dependencies/verification.md
expected_product:
- Implementar transporte do mínimo bilateral necessário e testes manuais A1–A4/A6; não antecipar A5/extensão D
- OPEN/READ/CLOSE literal atravessa CLIs SP→AIR→dependency com effects/control explicitamente parciais até
  W3/W4
- Consumer FILE independente compartilhando sessão/providers, inventário estrutural e nova seção/versionamento
  de JSON
allowed_changes:
- Codec/validator/catálogo AIR e contrato normativo somente por gap demonstrado
- Assembly/recursos lower, consumer/result/serializer/readers; fixtures/e2e no harness existente
forbidden_changes:
- Redefinir arrays CALL, usar artifacts como arquivos ou adicionar ResourceId como Target
- Fazer todo I/O de W2, fechar efeitos não provados ou eliminar literal por falha do solver
invariants:
- Todos os invariantes do brief e guardrail COBOL_SOURCE_ONLY
- Preservar CALL/evidência; literal não espera solver; mudanças normativas só bilaterais
semantic_cases:
- A1–A4/A6; T01/T02/T45/T48/T49/T51–T53; SELECT F ASSIGN TO CLIENTDD e OPEN/READ/CLOSE; A5 fica para D/W10
- Literal com CFG parcial, programa só CALL, sem arquivo, arquivo sem uso; CALL+FILE no mesmo input
tests:
- Oráculos independentes dos casos listados em test-catalog.md; positivos, negativos e adversariais antes do
  código
- W1dDependencyTest
- PartialDependencyTest
- test_dependency_wire.py
- InvokeChecks
regressions:
- W1dDependencyTest
- PartialDependencyTest
- test_dependency_wire.py
- InvokeChecks
commands_and_gates:
- 'A-CODEC: comando e escopo em ../../product/file-dependencies/verification.md'
- 'C-DEP: comando e escopo em ../../product/file-dependencies/verification.md'
- 'B-AIR: comando e escopo em ../../product/file-dependencies/verification.md'
- 'B-WIRE: comando e escopo em ../../product/file-dependencies/verification.md'
- 'E-SELECTED: comando e escopo em ../../product/file-dependencies/verification.md'
- python3 -B scripts/harness/lean.py fast — uma vez por repo produtivo estabilizado, após focais
acceptance:
- External file name derivado de ASSIGN é terminal exato sem campo/status DSNAME ou bindingMechanism; logical file/sourceKind/origens conservados
- Encode/decode/consumer preservam declaração/owner; negativo retirando campo indispensável falha
- CALL-only conserva projeção semântica; reader antigo recusa versão nova; reader novo tem assertions independentes
- Duas execuções iguais são determinísticas; falha de saída não deixa arquivo antigo passar por resultado novo
evidence:
- Commit/pin exatos por fronteira; comandos/exit/results reais, testes novos vs REUSED vs NOT_RUN
- Atualizar matriz somente com oracle/resultado; estado curto e PR persistente por repo, sem receipt obrigatório
stop_condition: Parar após vertical e contrato qualificados; perfil N ainda parcial, avanço depende da autorização
  vigente.
depends_on:
- FD-W0
